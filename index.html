<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC GIS Dashboard</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f8fafc;
      overflow: hidden;
    }

    /* 1. TOP NAVBAR */
    .navbar {
      height: 56px;
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2563eb;
    }

    .nav-badges {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background-color: #f1f5f9;
      color: #475569;
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .live-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #f1f5f9;
      padding: 4px 12px;
      border-radius: 18px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #334155;
    }

    /* 2. MAIN CONTAINER */
    .main-container {
      display: flex;
      flex: 1;
      position: relative;
    }

    /* 3. SIDEBAR */
    .sidebar {
      width: 250px;
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      z-index: 900;
    }

    .sidebar-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
    }

    .sidebar-header h3 {
      font-size: 0.75rem;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sidebar-header span {
      font-size: 0.8rem;
      color: #2563eb;
      font-weight: 600;
    }

    .sidebar-list {
      padding: 12px 16px;
      overflow-y: auto;
      flex: 1;
    }

    /* Layer Item & Icons */
    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .layer-label-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      color: #334155;
      font-weight: 500;
    }

    .color-icon {
      width: 12px;
      height: 12px;
      display: inline-block;
      flex-shrink: 0;
    }

    .sq-green { background-color: #84cc16; border-radius: 2px; }
    .circle-brown { background-color: #a16207; border-radius: 50%; }
    .circle-pink { background-color: #ec4899; border-radius: 50%; }
    .sq-orange { background-color: #f97316; border-radius: 2px; }
    .line-dark { background-color: #334155; height: 2px; width: 14px; }
    .line-gray { background-color: #64748b; height: 2px; width: 14px; }
    .circle-green { background-color: #22c55e; border-radius: 50%; }
    .sq-cream { background-color: #d97706; border-radius: 2px; opacity: 0.6; }
    .sq-pink { background-color: #ec4899; border-radius: 2px; }

    /* Switch Design */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 18px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .2s;
      border-radius: 18px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #2563eb;
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* 4. MAP CONTAINER */
    #map {
      flex: 1;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="brand-title">SMC GIS Dashboard</div>
    <div class="nav-badges">
      <div class="badge">26 Wards</div>
      <div class="badge">39 Health Units</div>
      <div class="badge">17 Emergency</div>
      <div class="live-toggle">
        <span>Live System</span>
        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="main-container">
    
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>LAYER CATALOG</h3>
        <span>Layers</span>
      </div>

      <div class="sidebar-list">
        
        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon sq-green"></span>
            Landuse
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-landuse" checked onchange="toggleLayer('landuse')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon circle-brown"></span>
            Places
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-places" checked onchange="toggleLayer('places')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon circle-pink"></span>
            pois
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-pois" checked onchange="toggleLayer('pois')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon sq-orange"></span>
            Pois_1
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-pois1" checked onchange="toggleLayer('pois1')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon line-dark"></span>
            Railways
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-railways" checked onchange="toggleLayer('railways')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon line-gray"></span>
            Roads
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-roads" checked onchange="toggleLayer('roads')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon circle-green"></span>
            Trafic
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-traffic" checked onchange="toggleLayer('traffic')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon sq-cream"></span>
            Transport
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-transport" checked onchange="toggleLayer('transport')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon sq-pink"></span>
            Water
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-water" checked onchange="toggleLayer('water')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon line-dark"></span>
            Waterways_Clip
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-waterways" checked onchange="toggleLayer('waterways')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon sq-orange"></span>
            Sangola_clip
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-sangola" checked onchange="toggleLayer('sangola')">
            <span class="slider"></span>
          </label>
        </div>

        <div class="layer-item">
          <div class="layer-label-group">
            <span class="color-icon line-gray"></span>
            Adminareas
          </div>
          <label class="switch">
            <input type="checkbox" id="chk-admin" checked onchange="toggleLayer('admin')">
            <span class="slider"></span>
          </label>
        </div>

      </div>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map"></div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Sangola Coordinates
    const sangolaCenter = [17.4332, 75.1978];

    // Initialize Map
    const map = L.map('map', {
      center: sangolaCenter,
      zoom: 13,
      zoomControl: true
    });

    // Google Satellite Layer
    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Satellite'
    }).addTo(map);

    const layers = {};

    // Sangola Polygon Layer
    layers['sangola'] = L.polygon([
      [17.442, 75.185], [17.445, 75.210], [17.428, 75.215], 
      [17.420, 75.205], [17.422, 75.180]
    ], {
      color: '#ec4899',
      fillColor: '#ec4899',
      fillOpacity: 0.65,
      weight: 1.5
    }).addTo(map);

    // Points Overlay
    layers['pois'] = L.layerGroup([
      L.circleMarker([17.438, 75.201], { radius: 5, fillColor: '#ec4899', color: '#fff', fillOpacity: 0.9 }),
      L.circleMarker([17.430, 75.195], { radius: 5, fillColor: '#ec4899', color: '#fff', fillOpacity: 0.9 }),
      L.circleMarker([17.435, 75.208], { radius: 5, fillColor: '#ec4899', color: '#fff', fillOpacity: 0.9 })
    ]).addTo(map);

    // Toggle Layer Control
    function toggleLayer(key) {
      const isChecked = document.getElementById(`chk-${key}`)?.checked;
      if (layers[key]) {
        if (isChecked) {
          map.addLayer(layers[key]);
        } else {
          map.removeLayer(layers[key]);
        }
      }
    }
  </script>
</body>
</html>
